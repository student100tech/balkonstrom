name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Projektdateien anlegen
        run: |
          mkdir -p www
          cat > package.json <<'EOF_PKG'
          {
            "name": "balkonstrom-live",
            "version": "1.0.0",
            "private": true,
            "description": "Live-Anzeige für den Zendure SolarFlow 800 Plus (lokal über zenSDK)",
            "scripts": {
              "sync": "npx cap sync android",
              "open": "npx cap open android"
            },
            "dependencies": {
              "@capacitor/android": "latest",
              "@capacitor/core": "latest"
            },
            "devDependencies": {
              "@capacitor/cli": "latest"
            }
          }
          EOF_PKG
          cat > capacitor.config.json <<'EOF_CAP'
          {
            "appId": "de.elektroautonews.balkonstrom",
            "appName": "Balkonstrom Live",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "cleartext": true
            },
            "plugins": {
              "CapacitorHttp": {
                "enabled": true
              }
            }
          }
          EOF_CAP
          cat > www/index.html <<'EOF_HTML'
          <!DOCTYPE html>
          <html lang="de">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <meta name="theme-color" content="#0f1420">
          <title>Balkonstrom Live</title>
          <style>
            :root{
              --bg:#0f1420; --card:#181f2e; --card2:#1f2839; --line:#2a3447;
              --text:#e8edf6; --muted:#8b96ab;
              --solar:#f5a524; --home:#8b7cf6; --bat:#2dd4bf; --grid:#94a3b8; --warn:#f87171;
            }
            *{box-sizing:border-box;margin:0;padding:0}
            html,body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
            body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
            .wrap{max-width:480px;margin:0 auto;padding:14px 14px 28px}
            header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
            h1{font-size:20px;font-weight:700;letter-spacing:.3px}
            h1 small{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:2px}
            .pill{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 12px;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
            .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
            .dot.ok{background:#22c55e} .dot.err{background:var(--warn)} .dot.demo{background:var(--solar)}
            .iconbtn{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;flex:none}
            .sun{margin:4px 0 2px}
            .sun svg{width:100%;height:auto;display:block}
            .sunrow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:-2px}
            .flow{position:relative;margin:6px 0 4px}
            .flow svg{width:100%;height:auto;display:block}
            .node-label{font-size:13px;fill:var(--muted)}
            .node-val{font-size:22px;font-weight:700;fill:var(--text);font-variant-numeric:tabular-nums}
            .node-sub{font-size:11.5px;fill:var(--muted)}
            .wire{stroke:var(--line);stroke-width:4;fill:none;stroke-linecap:round}
            .wire.on{stroke-dasharray:6 10;animation:flow 1s linear infinite}
            .wire.rev{animation-direction:reverse}
            @keyframes flow{to{stroke-dashoffset:-16}}
            .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
            .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 13px}
            .card h3{font-size:12.5px;font-weight:500;color:var(--muted);margin-bottom:6px}
            .card .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
            .card .s{font-size:12px;color:var(--muted);margin-top:3px}
            .wide{grid-column:1/-1}
            .bar{height:8px;border-radius:5px;background:var(--card2);overflow:hidden;margin-top:8px;position:relative}
            .bar i{display:block;height:100%;background:var(--bat);border-radius:5px;transition:width .6s}
            .bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--muted)}
            .msg{background:#3a1f25;border:1px solid #6b2a33;color:#fecaca;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px;display:none;line-height:1.4}
            .msg button{margin-top:8px}
            .btn{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px;font-size:14px;cursor:pointer}
            .btn.primary{background:var(--bat);border-color:var(--bat);color:#06201c;font-weight:600}
            dialog{margin:auto;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:18px;width:min(92vw,420px)}
            dialog::backdrop{background:rgba(0,0,0,.6)}
            dialog h2{font-size:17px;margin-bottom:12px}
            label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}
            input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px}
            .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
            .foot{font-size:11.5px;color:var(--muted);text-align:center;margin-top:16px}
          </style>
          </head>
          <body>
          <div class="wrap">
            <header>
              <h1>Balkonstrom<small id="devname">SolarFlow 800 Plus</small></h1>
              <div style="display:flex;gap:8px;align-items:center">
                <div class="pill"><span class="dot" id="dot"></span><span id="status">Verbinde…</span></div>
                <button class="iconbtn" id="btnSettings" aria-label="Einstellungen">⚙</button>
              </div>
            </header>

            <div class="sun">
              <svg viewBox="0 0 400 120" aria-hidden="true">
                <line x1="20" y1="105" x2="380" y2="105" stroke="var(--line)" stroke-width="1.5"/>
                <path id="sunArc" d="" fill="none" stroke="var(--solar)" stroke-width="1.5" stroke-dasharray="3 4" opacity=".8"/>
                <circle id="sunDot" r="9" fill="var(--solar)" opacity="0"/>
              </svg>
              <div class="sunrow"><span id="sunrise">Aufgang –</span><span id="daylight"></span><span id="sunset">Untergang –</span></div>
            </div>

            <div class="flow">
              <svg viewBox="0 0 400 330">
                <!-- Leitungen -->
                <path id="wSolar" class="wire" d="M200 82 V150"/>
                <path id="wGrid" class="wire" d="M92 175 H175"/>
                <path id="wHome" class="wire" d="M225 175 H308"/>
                <path id="wBat" class="wire" d="M200 200 V250"/>
                <!-- Mitte -->
                <circle cx="200" cy="175" r="25" fill="var(--card2)" stroke="var(--line)"/>
                <path d="M204 160 l-12 18 h9 l-4 13 l12-18 h-9z" fill="var(--text)"/>
                <!-- Solar -->
                <circle cx="200" cy="48" r="34" fill="var(--card)" stroke="var(--solar)" stroke-width="2"/>
                <g fill="none" stroke="var(--solar)" stroke-width="2"><path d="M184 40 h32 l-4 16 h-32z"/><path d="M182 48 h32 M193 40 l-3 16 M205 40 l-3 16"/></g>
                <text class="node-label" x="135" y="34" text-anchor="end">Solar</text>
                <text class="node-val" x="135" y="60" text-anchor="end" id="tSolar">– W</text>
                <text class="node-sub" x="248" y="40" id="tPv1">PV1 – W</text>
                <text class="node-sub" x="248" y="60" id="tPv2">PV2 – W</text>
                <!-- Netz -->
                <circle cx="62" cy="175" r="30" fill="var(--card)" stroke="var(--grid)" stroke-width="2"/>
                <g fill="none" stroke="var(--grid)" stroke-width="2"><path d="M62 158 l-9 34 M62 158 l9 34 M52 167 h20 M55 178 h14"/></g>
                <text class="node-label" x="62" y="225" text-anchor="middle">Netz → Akku</text>
                <text class="node-val" x="62" y="250" text-anchor="middle" id="tGrid">– W</text>
                <!-- Haus -->
                <circle cx="338" cy="175" r="30" fill="var(--card)" stroke="var(--home)" stroke-width="2"/>
                <path d="M324 180 v12 h28 v-12 M320 182 l18-16 l18 16" fill="none" stroke="var(--home)" stroke-width="2"/>
                <text class="node-label" x="338" y="225" text-anchor="middle">Ins Haus</text>
                <text class="node-val" x="338" y="250" text-anchor="middle" id="tHome">– W</text>
                <!-- Akku -->
                <circle cx="200" cy="285" r="34" fill="var(--card)" stroke="var(--line)" stroke-width="5"/>
                <circle id="socRing" cx="200" cy="285" r="34" fill="none" stroke="var(--bat)" stroke-width="5" stroke-linecap="round"
                        transform="rotate(-90 200 285)" stroke-dasharray="0 214"/>
                <text x="200" y="292" text-anchor="middle" style="font-size:20px;font-weight:700;fill:var(--text)" id="tSoc">–%</text>
                <text class="node-label" x="250" y="276" id="tBatState">Akku</text>
                <text class="node-val" x="250" y="302" id="tBat">– W</text>
              </svg>
            </div>

            <div class="msg" id="msg"></div>

            <div class="cards">
              <div class="card wide">
                <h3>Akku</h3>
                <div class="v" id="cEnergy">– kWh</div>
                <div class="s" id="cRemain">&nbsp;</div>
                <div class="bar"><i id="barFill" style="width:0"></i><b id="barMin" style="left:10%"></b><b id="barMax" style="left:100%"></b></div>
                <div class="s" id="cLimits">&nbsp;</div>
              </div>
              <div class="card"><h3>Ausgangslimit</h3><div class="v" id="cOutLimit">– W</div><div class="s" id="cMax">&nbsp;</div></div>
              <div class="card"><h3>Modus</h3><div class="v" id="cMode" style="font-size:17px">–</div><div class="s" id="cInLimit">&nbsp;</div></div>
              <div class="card"><h3>Temperatur</h3><div class="v" id="cTemp">– °C</div><div class="s" id="cPackTemp">&nbsp;</div></div>
              <div class="card"><h3>WLAN</h3><div class="v" id="cRssi">– dBm</div><div class="s" id="cVolt">&nbsp;</div></div>
            </div>

            <div class="foot" id="foot">Daten direkt vom Gerät im WLAN (zenSDK)</div>
          </div>

          <dialog id="dlg">
            <h2>Einstellungen</h2>
            <label for="inIp">IP-Adresse des SolarFlow</label>
            <input id="inIp" inputmode="decimal" placeholder="192.168.178.51">
            <label for="inCap">Akku-Kapazität (Wh)</label>
            <input id="inCap" inputmode="numeric" placeholder="1920">
            <label for="inInt">Aktualisierung alle … Sekunden (min. 3)</label>
            <input id="inInt" inputmode="numeric" placeholder="5">
            <div class="row">
              <button class="btn" id="btnDemo">Demo-Daten</button>
              <button class="btn" id="btnCancel">Abbrechen</button>
              <button class="btn primary" id="btnSave">Speichern</button>
            </div>
          </dialog>

          <script>
          (() => {
            // ---------- Einstellungen ----------
            const LAT = 51.2277, LON = 6.7735; // Düsseldorf (für Sonnenbogen)
            const store = {
              get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
              set(k, v){ try { localStorage.setItem(k, v); } catch {} }
            };
            let cfg = {
              ip: store.get('ip', '192.168.178.51'),
              cap: Number(store.get('cap', 1920)),
              interval: Math.max(3, Number(store.get('interval', 5)))
            };
            let demo = false, timer = null, fails = 0;

            const $ = id => document.getElementById(id);
            const fmtW = w => (w == null || isNaN(w)) ? '– W' : `${Math.round(w)} W`;
            const fmtKwh = wh => (wh/1000).toLocaleString('de-DE', {minimumFractionDigits:2, maximumFractionDigits:2});

            // ---------- Daten holen ----------
            async function fetchReport(){
              if (demo) return demoData();
              const ctrl = new AbortController();
              const t = setTimeout(() => ctrl.abort(), 4000);
              try {
                // Über den PC-Helfer (balkonstrom_server.py) geladen → Daten über ihn holen (kein CORS-Problem)
                const viaHelper = !window.Capacitor && location.protocol === 'http:';
                const url = viaHelper ? `/api/report?ip=${encodeURIComponent(cfg.ip)}` : `http://${cfg.ip}/properties/report`;
                const r = await fetch(url, {signal: ctrl.signal, cache: 'no-store'});
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return await r.json();
              } finally { clearTimeout(t); }
            }

            function demoData(){
              const h = new Date().getHours() + new Date().getMinutes()/60;
              const sun = Math.max(0, Math.sin((h-8)/9*Math.PI));
              const pv1 = Math.round(380*sun + Math.random()*10*sun), pv2 = Math.round(350*sun + Math.random()*10*sun);
              const home = sun > .3 ? 200 : 150;
              const solar = pv1 + pv2;
              const charge = Math.max(0, solar - home), dis = Math.max(0, home - solar);
              return {product:'solarFlow800Plus', properties:{solarInputPower:solar, solarPower1:pv1, solarPower2:pv2,
                outputHomePower:home, outputPackPower:charge, packInputPower:dis, gridInputPower:0, electricLevel:62,
                packState: charge ? 1 : (dis ? 2 : 0), remainOutTime: dis ? 540 : 59940, hyperTmp:2911, BatVolt:5120,
                acMode:2, inputLimit:0, outputLimit:home, socSet:1000, minSoc:100, inverseMaxPower:800, chargeMaxLimit:800, rssi:-58},
                packData:[{maxTemp:2891}]};
            }

            // ---------- Anzeige ----------
            function setWire(id, watts, reverse){
              const el = $(id), on = watts > 2;
              el.classList.toggle('on', on);
              el.classList.toggle('rev', !!reverse);
              el.style.stroke = on ? el.dataset.color : '';
            }
            $('wSolar').dataset.color = 'var(--solar)';
            $('wGrid').dataset.color = 'var(--grid)';
            $('wHome').dataset.color = 'var(--home)';
            $('wBat').dataset.color = 'var(--bat)';

            const tempC = raw => raw ? (raw - 2731) / 10 : null;

            function render(d){
              const p = d.properties || {};
              const solar = p.solarInputPower ?? 0;
              const home = p.outputHomePower ?? 0;
              const grid = p.gridInputPower ?? 0;
              const charge = p.outputPackPower ?? 0;     // in den Akku
              const discharge = p.packInputPower ?? 0;   // aus dem Akku
              const soc = p.electricLevel ?? 0;

              $('devname').textContent = d.product === 'solarFlow800Plus' ? 'SolarFlow 800 Plus' : (d.product || 'SolarFlow');
              $('tSolar').textContent = fmtW(solar);
              $('tPv1').textContent = `PV1 ${fmtW(p.solarPower1)}`;
              $('tPv2').textContent = `PV2 ${fmtW(p.solarPower2)}`;
              $('tHome').textContent = fmtW(home);
              $('tGrid').textContent = fmtW(grid);
              $('tSoc').textContent = `${soc}%`;
              $('socRing').setAttribute('stroke-dasharray', `${(soc/100*213.6).toFixed(1)} 214`);

              let batW = 0, batTxt = 'Akku', batRev = false;
              if (charge > 0) { batW = charge; batTxt = 'Akku lädt'; batRev = false; }
              else if (discharge > 0) { batW = discharge; batTxt = 'Akku entlädt'; batRev = true; }
              else batTxt = 'Akku ruht';
              $('tBat').textContent = fmtW(batW);
              $('tBatState').textContent = batTxt;

              setWire('wSolar', solar);
              setWire('wHome', home);
              setWire('wGrid', grid);
              setWire('wBat', batW, batRev);

              // Akku-Karte
              const wh = cfg.cap * soc / 100;
              $('cEnergy').textContent = `${fmtKwh(wh)} von ${fmtKwh(cfg.cap)} kWh`;
              const min = (p.minSoc ?? 100) / 10, max = (p.socSet ?? 1000) / 10;
              $('barFill').style.width = soc + '%';
              $('barMin').style.left = min + '%';
              $('barMax').style.left = `calc(${max}% - 2px)`;
              $('cLimits').textContent = `Entladen bis ${min} % · Laden bis ${max} %`;
              let remain = '';
              if (discharge > 0 && p.remainOutTime && p.remainOutTime < 59000) {
                const end = new Date(Date.now() + p.remainOutTime * 60000);
                const hh = Math.floor(p.remainOutTime/60), mm = p.remainOutTime % 60;
                remain = `reicht noch ca. ${hh} h ${mm} min (bis ${end.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})})`;
              } else if (charge > 0) remain = `lädt mit ${fmtW(charge)}`;
              $('cRemain').textContent = remain || ' ';

              $('cOutLimit').textContent = fmtW(p.outputLimit);
              $('cMax').textContent = `max. ${fmtW(p.inverseMaxPower)} Einspeisung`;
              $('cMode').textContent = p.acMode === 1 ? 'Laden aus Netz' : (p.acMode === 2 ? 'Abgabe ins Haus' : '–');
              $('cInLimit').textContent = p.acMode === 1 ? `Ladelimit ${fmtW(p.inputLimit)}` : `Laden max. ${fmtW(p.chargeMaxLimit)}`;
              const t = tempC(p.hyperTmp), tp = tempC(d.packData?.[0]?.maxTemp);
              $('cTemp').textContent = t == null ? '– °C' : `${t.toFixed(1).replace('.', ',')} °C`;
              $('cPackTemp').textContent = tp == null ? ' ' : `Akku ${tp.toFixed(1).replace('.', ',')} °C`;
              $('cRssi').textContent = p.rssi ? `${p.rssi} dBm` : '– dBm';
              $('cVolt').textContent = p.BatVolt ? `Akku ${(p.BatVolt/100).toFixed(1).replace('.', ',')} V` : ' ';
            }

            function setStatus(kind, text){
              $('dot').className = 'dot ' + kind;
              $('status').textContent = text;
            }

            function showMsg(html){
              const m = $('msg');
              if (!html) { m.style.display = 'none'; return; }
              m.innerHTML = html; m.style.display = 'block';
            }

            async function tick(){
              try {
                const d = await fetchReport();
                render(d);
                fails = 0;
                showMsg('');
                setStatus(demo ? 'demo' : 'ok', (demo ? 'Demo ' : 'Live ') + new Date().toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'}));
                $('foot').textContent = demo ? 'Demo-Daten – keine Verbindung zum Gerät' : `Daten direkt vom Gerät (${cfg.ip}) · alle ${cfg.interval} s`;
              } catch (e) {
                fails++;
                setStatus('err', 'Offline');
                if (fails >= 2) showMsg(`Keine Verbindung zum SolarFlow unter <b>${cfg.ip}</b>.<br>
                  Ist das Handy im selben WLAN? Stimmt die IP-Adresse?<br>
                  <button class="btn" onclick="document.getElementById('btnSettings').click()">Einstellungen öffnen</button>`);
              }
            }

            function start(){
              clearInterval(timer);
              tick();
              timer = setInterval(tick, cfg.interval * 1000);
            }

            // Pausieren, wenn die App im Hintergrund ist
            document.addEventListener('visibilitychange', () => {
              if (document.hidden) clearInterval(timer); else start();
            });

            // ---------- Einstellungen-Dialog ----------
            const dlg = $('dlg');
            $('btnSettings').onclick = () => {
              $('inIp').value = cfg.ip; $('inCap').value = cfg.cap; $('inInt').value = cfg.interval;
              dlg.showModal();
            };
            $('btnCancel').onclick = () => dlg.close();
            $('btnSave').onclick = () => {
              cfg.ip = ($('inIp').value || '').trim() || cfg.ip;
              cfg.cap = Math.max(100, Number($('inCap').value) || 1920);
              cfg.interval = Math.max(3, Number($('inInt').value) || 5);
              store.set('ip', cfg.ip); store.set('cap', cfg.cap); store.set('interval', cfg.interval);
              demo = false; dlg.close(); start();
            };
            $('btnDemo').onclick = () => { demo = true; dlg.close(); start(); };

            // ---------- Sonnenbogen ----------
            function sunTimes(date){
              // vereinfachte NOAA-Formel, Genauigkeit ± wenige Minuten
              const rad = Math.PI/180;
              const start = new Date(date.getFullYear(), 0, 0);
              const n = Math.floor((date - start) / 864e5);
              const g = 2*Math.PI/365 * (n - 1);
              const eqt = 229.18*(0.000075 + 0.001868*Math.cos(g) - 0.032077*Math.sin(g) - 0.014615*Math.cos(2*g) - 0.040849*Math.sin(2*g));
              const decl = 0.006918 - 0.399912*Math.cos(g) + 0.070257*Math.sin(g) - 0.006758*Math.cos(2*g) + 0.000907*Math.sin(2*g) - 0.002697*Math.cos(3*g) + 0.00148*Math.sin(3*g);
              const ha = Math.acos(Math.cos(90.833*rad)/(Math.cos(LAT*rad)*Math.cos(decl)) - Math.tan(LAT*rad)*Math.tan(decl)) / rad;
              const noonUtcMin = 720 - 4*LON - eqt;
              const mid = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
              return {
                rise: new Date(mid.getTime() + (noonUtcMin - 4*ha) * 60000),
                set:  new Date(mid.getTime() + (noonUtcMin + 4*ha) * 60000)
              };
            }
            function drawSun(){
              const now = new Date(), {rise, set} = sunTimes(now);
              const x0 = 30, x1 = 370, base = 105, top = 14;
              const pt = f => { const x = x0 + (x1-x0)*f; const y = base - (base-top)*Math.sin(Math.PI*f); return [x, y]; };
              let d = ''; for (let i = 0; i <= 40; i++) { const [x, y] = pt(i/40); d += (i ? ' L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1); }
              $('sunArc').setAttribute('d', d);
              const f = (now - rise) / (set - rise);
              const dot = $('sunDot');
              if (f >= 0 && f <= 1) { const [x, y] = pt(f); dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.setAttribute('opacity', 1); }
              else dot.setAttribute('opacity', 0);
              const hm = t => t.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
              $('sunrise').textContent = 'Aufgang ' + hm(rise);
              $('sunset').textContent = 'Untergang ' + hm(set);
              if (f > 0 && f < 1) { const left = Math.round((set - now)/60000); $('daylight').textContent = `noch ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')} h Tageslicht`; }
              else $('daylight').textContent = '';
            }
            drawSun(); setInterval(drawSun, 60000);

            // Demo per URL (?demo) – praktisch zum Anschauen am PC
            if (location.search.includes('demo')) demo = true;
            // Außerhalb der Android-App auf einer https-Seite (Vorschau) geht kein Gerätezugriff → Demo
            if (!window.Capacitor && location.protocol === 'https:') demo = true;
            start();
          })();
          </script>
          </body>
          </html>
          EOF_HTML

      - name: Android-Projekt erzeugen
        run: |
          npm install
          npx cap add android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Balkonstrom-Live.apk

      - name: Als Release veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Balkonstrom Live (Build ${{ github.run_number }})
          files: Balkonstrom-Live.apk
          make_latest: true
