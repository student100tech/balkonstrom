name: APK bauen

on:
  push:
    branches: [main]
    # Reine Firmware-Aenderungen bauen keine neue APK - sonst bot die App
    # nach jeder Firmware ein "Update" ohne jede Aenderung an.
    paths-ignore:
      - 'firmware/**'
      - '.github/workflows/build-firmware.yml'
      - 'tools/vorschau.cpp'
      - 'tools/schriften.py'
      - 'tools/ikonen.py'
      - 'tools/zertifikate.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Version festlegen
        run: |
          DATUM=$(TZ=Europe/Berlin date +%F)
          echo "DATUM=$DATUM" >> $GITHUB_ENV
          echo "APKNAME=PV-Monitor_${DATUM}_Build-${{ github.run_number }}.apk" >> $GITHUB_ENV
          sed -i "s/__APPVERSION__/2.${{ github.run_number }} · Build ${{ github.run_number }} · ${DATUM}/g" www/index.html
          sed -i "s/__BUILDNR__/${{ github.run_number }}/g" www/index.html

      - name: Android-Projekt erzeugen
        run: |
          npm install
          npx cap add android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          # Update-Funktion: Installationsrecht, eigenes Plugin, Dateifreigabe
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />#' android/app/src/main/AndroidManifest.xml
          grep -q REQUEST_INSTALL_PACKAGES android/app/src/main/AndroidManifest.xml
          grep -q 'fileprovider' android/app/src/main/AndroidManifest.xml
          # Gerätesuche im WLAN (mDNS + Netz absuchen): Netzwerk-/WLAN-Status lesen, Multicast empfangen
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />#' android/app/src/main/AndroidManifest.xml
          grep -q CHANGE_WIFI_MULTICAST_STATE android/app/src/main/AndroidManifest.xml
          # Monitor flashen: USB-Gastgeber, nicht erzwungen
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-feature android:name="android.hardware.usb.host" android:required="false" />#' android/app/src/main/AndroidManifest.xml
          grep -q 'usb.host' android/app/src/main/AndroidManifest.xml
          # usb-serial-for-android liegt nur bei JitPack, nicht bei Maven Central.
          # Wohin die Zeile gehoert, haengt davon ab, wie Capacitor das Projekt
          # anlegt - darum nicht mit sed raten, sondern nachsehen.
          python3 - <<'PY'
          import io, re
          sg = 'android/settings.gradle'
          s = io.open(sg).read()
          zeile = '        maven { url "https://jitpack.io" }\n'
          if 'dependencyResolutionManagement' in s:
              i = s.index('dependencyResolutionManagement')
              j = s.index('repositories', i)
              k = s.index('{', j) + 1
              io.open(sg, 'w').write(s[:k] + '\n' + zeile + s[k:])
          else:
              io.open('android/build.gradle', 'a').write(
                  '\nallprojects {\n    repositories {\n'
                  '        maven { url "https://jitpack.io" }\n    }\n}\n')
          PY
          grep -rq jitpack android/settings.gradle android/build.gradle
          cat >> android/app/build.gradle <<'GRADLE'

          dependencies {
              implementation 'com.github.mik3y:usb-serial-for-android:3.7.0'
          }
          GRADLE
          cp android-src/MainActivity.java android-src/UpdaterPlugin.java android-src/DiscoveryPlugin.java android-src/EspFlashPlugin.java android/app/src/main/java/de/elektroautonews/balkonstrom/
          cp android-src/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          sed -i 's/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName "1.0"/versionName "2.${{ github.run_number }}"/' android/app/build.gradle
          npx @capacitor/assets generate --android --iconBackgroundColor '#0f1420' --iconBackgroundColorDark '#0f1420' --splashBackgroundColor '#0f1420' --splashBackgroundColorDark '#0f1420'
          npx cap sync android
          # Fester Signierschlüssel aus dem Repository -> Updates lassen sich über die alte Version installieren
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  fixed {
                      storeFile file("${rootDir}/../android-debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.fixed }
              }
          }
          GRADLE

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "../$APKNAME"

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PV-Monitor – Build ${{ github.run_number }} (${{ env.DATUM }})
          body: |
            Live-Anzeige für Balkon- und Hausspeicher, rein lokal im WLAN –
            kein Konto, keine Cloud. Es wird nur gelesen, nichts gesteuert.

            Installation: APK herunterladen, öffnen, installieren.

            `4.0_LvglWidgets.bin` ist **nicht** die Firmware des Monitors,
            sondern die Demo des Board-Herstellers. Sie liegt bei, damit sich
            der Aufspielvorgang in der App prüfen lässt, solange unsere eigene
            Firmware noch nicht existiert. Siehe `firmware/pruefbild/`.
          files: |
            ${{ env.APKNAME }}
            firmware/pruefbild/4.0_LvglWidgets.bin
          make_latest: true
