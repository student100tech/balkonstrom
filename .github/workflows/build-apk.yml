name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Version festlegen
        run: |
          DATUM=$(TZ=Europe/Berlin date +%F)
          echo "DATUM=$DATUM" >> $GITHUB_ENV
          echo "APKNAME=Balkonstrom-Live_${DATUM}_Build-${{ github.run_number }}.apk" >> $GITHUB_ENV
          sed -i "s/__APPVERSION__/2.${{ github.run_number }} · Build ${{ github.run_number }} · ${DATUM}/g" www/index.html

      - name: Android-Projekt erzeugen
        run: |
          npm install
          npx cap add android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName "1.0"/versionName "2.${{ github.run_number }}"/' android/app/build.gradle
          npx @capacitor/assets generate --android --iconBackgroundColor '#0f1420' --iconBackgroundColorDark '#0f1420' --splashBackgroundColor '#0f1420' --splashBackgroundColorDark '#0f1420'
          npx cap sync android
          # Fester Signierschlüssel aus dem Repository -> Updates lassen sich über die alte Version installieren
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  fixed {
                      storeFile file("${rootDir}/../android-debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.fixed }
              }
          }
          GRADLE

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "../$APKNAME"

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Balkonstrom Live – Build ${{ github.run_number }} (${{ env.DATUM }})
          body: |
            Live-Anzeige, Statistik (Zendure-Cloud) und Steuerung für den SolarFlow 800 Plus.
            Installation: APK herunterladen, öffnen, installieren.
          files: ${{ env.APKNAME }}
          make_latest: true
