name: Zendure-App analysieren

on:
  push:
    branches: [analyse]

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: apkeep holen
        run: |
          curl -sL -o apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x apkeep && ./apkeep --version

      - name: Neueste Version laden (Huawei AppGallery)
        run: |
          set +e
          ./apkeep -a com.zendure.app -l -d huawei-app-gallery 2>&1 | tail -5
          mkdir -p dl && ./apkeep -a com.zendure.app -d huawei-app-gallery dl 2>&1 | tail -5
          ls -la dl

      - name: Entpacken und Version bestimmen
        run: |
          set +e
          f=$(ls dl/* | head -1); echo "Datei: $f"
          mkdir -p x && unzip -q -o "$f" -d x
          for a in x/*.apk; do [ -f "$a" ] && mkdir -p "x/_$(basename $a)" && unzip -q -o "$a" -d "x/_$(basename $a)"; done
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          base=$(ls x/*.apk 2>/dev/null | grep -i -E "base|com.zendure" | head -1); [ -z "$base" ] && base="$f"
          $AAPT dump badging "$base" 2>/dev/null | grep -E "^package|sdkVersion" | head -3
          cat x/manifest.json 2>/dev/null | head -c 400; echo
          echo "dex-Dateien: $(find x -name '*.dex' | wc -l), so: $(find x -name '*.so' | wc -l)"
          find x -name '*.so' -printf '%s %p\n' | sort -rn | head -15

      - name: Adressen suchen
        run: |
          python3 repo/dexstrings.py x > endpunkte.txt 2>&1
          echo "Anzahl: $(wc -l < endpunkte.txt)"
          grep -vE "^URL " endpunkte.txt | head -400
          echo "== Treffer in .so/.js/sonstigen Dateien"
          grep -rhaoE "(tdengine|productModule|panel|meter|smartMeter|hems|energy|grid|phase)/[A-Za-z0-9_/.-]{2,80}" x --include=*.so --include=*.js --include=*.json 2>/dev/null | sort | uniq -c | sort -rn | head -150
